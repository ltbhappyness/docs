<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg{fill:#f4ecd8}
      .title{fill:#1a3a5c;font-size:20px;font-weight:700;text-anchor:middle}
      .core{fill:#1a3a5c;stroke:#0e2540;stroke-width:1.5}
      .core-l{fill:#fff;font-size:13px;font-weight:700;text-anchor:middle}
      .app{fill:#dfe7f0;stroke:#1a3a5c;stroke-width:1.5}
      .app-l{fill:#1a3a5c;font-size:13px;font-weight:700;text-anchor:middle}
      .tool{fill:#fff8df;stroke:#c9a227;stroke-width:1.5}
      .tool-l{fill:#1a3a5c;font-size:12px;font-weight:700;text-anchor:middle}
      .ext{fill:#fff;stroke:#6c7a89;stroke-width:1.2;stroke-dasharray:4 3}
      .ext-l{fill:#2b2b2b;font-size:11px;text-anchor:middle}
      .arrow{stroke:#c9a227;stroke-width:1.5;fill:none;marker-end:url(#ah)}
      .arrow-w{stroke:#6c7a89;stroke-width:1;fill:none;marker-end:url(#ah2);stroke-dasharray:3 2}
      .small{fill:#2b2b2b;font-size:10px}
      .caption{fill:#2b2b2b;font-size:11px;font-style:italic;text-anchor:middle}
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9a227"/>
    </marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c7a89"/>
    </marker>
  </defs>
  <rect class="bg" width="980" height="640"/>
  <text class="title" x="490" y="32">Submodule dependency graph (CMake .config selects which modules build)</text>

  <!-- Externals (bottom) -->
  <g>
    <rect class="ext" x="40"  y="540" width="120" height="50" rx="4"/>
    <text class="ext-l" x="100" y="560">libsodium (NaCl)</text>
    <text class="ext-l" x="100" y="576" font-size="10">crypto primitives</text>

    <rect class="ext" x="180" y="540" width="120" height="50" rx="4"/>
    <text class="ext-l" x="240" y="560">libgit2</text>
    <text class="ext-l" x="240" y="576" font-size="10">SHA-256 mode</text>

    <rect class="ext" x="320" y="540" width="120" height="50" rx="4"/>
    <text class="ext-l" x="380" y="560">libp2p (rust core)</text>
    <text class="ext-l" x="380" y="576" font-size="10">via C ABI</text>

    <rect class="ext" x="460" y="540" width="120" height="50" rx="4"/>
    <text class="ext-l" x="520" y="560">gRPC C++</text>
    <text class="ext-l" x="520" y="576" font-size="10">+ protobuf</text>

    <rect class="ext" x="600" y="540" width="120" height="50" rx="4"/>
    <text class="ext-l" x="660" y="560">arkworks / circom</text>
    <text class="ext-l" x="660" y="576" font-size="10">ZK SNARK</text>

    <rect class="ext" x="740" y="540" width="120" height="50" rx="4"/>
    <text class="ext-l" x="800" y="560">liboqs</text>
    <text class="ext-l" x="800" y="576" font-size="10">PQ ready</text>

    <rect class="ext" x="880" y="540" width="80"  height="50" rx="4"/>
    <text class="ext-l" x="920" y="560">tpm2-tss</text>
    <text class="ext-l" x="920" y="576" font-size="10">attest</text>
  </g>

  <!-- Core (middle) -->
  <g>
    <rect class="core" x="40"  y="380" width="140" height="60" rx="4"/>
    <text class="core-l" x="110" y="405">core-crypto</text>
    <text class="core-l" x="110" y="425" font-size="10" font-weight="400">C wrappers + KDF</text>

    <rect class="core" x="200" y="380" width="140" height="60" rx="4"/>
    <text class="core-l" x="270" y="405">core-storage</text>
    <text class="core-l" x="270" y="425" font-size="10" font-weight="400">git wrapper + indexes</text>

    <rect class="core" x="360" y="380" width="140" height="60" rx="4"/>
    <text class="core-l" x="430" y="405">core-p2p</text>
    <text class="core-l" x="430" y="425" font-size="10" font-weight="400">libp2p binding</text>

    <rect class="core" x="520" y="380" width="140" height="60" rx="4"/>
    <text class="core-l" x="590" y="405">core-rpc</text>
    <text class="core-l" x="590" y="425" font-size="10" font-weight="400">gRPC + lp2p stream</text>

    <rect class="core" x="680" y="380" width="140" height="60" rx="4"/>
    <text class="core-l" x="750" y="405">core-identity</text>
    <text class="core-l" x="750" y="425" font-size="10" font-weight="400">PoP + HW attest</text>

    <rect class="core" x="840" y="380" width="120" height="60" rx="4"/>
    <text class="core-l" x="900" y="405">core-vbc</text>
    <text class="core-l" x="900" y="425" font-size="10" font-weight="400">int-only VM</text>
  </g>

  <rect class="core" x="380" y="290" width="220" height="60" rx="4"/>
  <text class="core-l" x="490" y="315">core-consensus</text>
  <text class="core-l" x="490" y="335" font-size="10" font-weight="400">HotStuff base + Bullshark mempool</text>

  <!-- Apps (top) -->
  <g>
    <rect class="app" x="40"  y="170" width="130" height="60" rx="4"/>
    <text class="app-l" x="105" y="195">app-chanting</text>
    <text class="app-l" x="105" y="213" font-size="10" font-weight="400">messaging</text>

    <rect class="app" x="180" y="170" width="130" height="60" rx="4"/>
    <text class="app-l" x="245" y="195">app-builder</text>
    <text class="app-l" x="245" y="213" font-size="10" font-weight="400">distributed build</text>

    <rect class="app" x="320" y="170" width="130" height="60" rx="4"/>
    <text class="app-l" x="385" y="195">app-discovery</text>
    <text class="app-l" x="385" y="213" font-size="10" font-weight="400">S3E gossip beacon</text>

    <rect class="app" x="460" y="170" width="130" height="60" rx="4"/>
    <text class="app-l" x="525" y="195">app-search</text>
    <text class="app-l" x="525" y="213" font-size="10" font-weight="400">graph queries</text>

    <rect class="app" x="600" y="170" width="130" height="60" rx="4"/>
    <text class="app-l" x="665" y="195">app-marketplace</text>
    <text class="app-l" x="665" y="213" font-size="10" font-weight="400">(TODO)</text>

    <rect class="app" x="740" y="170" width="130" height="60" rx="4"/>
    <text class="app-l" x="805" y="195">app-stream</text>
    <text class="app-l" x="805" y="213" font-size="10" font-weight="400">(TODO)</text>
  </g>

  <!-- Tools -->
  <rect class="tool" x="40"  y="80" width="200" height="50" rx="4"/>
  <text class="tool-l" x="140" y="100">tools/cli</text>
  <text class="tool-l" x="140" y="116" font-size="10" font-weight="400">vedamctl</text>

  <rect class="tool" x="280" y="80" width="200" height="50" rx="4"/>
  <text class="tool-l" x="380" y="100">tools/builder</text>
  <text class="tool-l" x="380" y="116" font-size="10" font-weight="400">distributed Nix-flake driver</text>

  <rect class="tool" x="520" y="80" width="200" height="50" rx="4"/>
  <text class="tool-l" x="620" y="100">tools/indexer</text>
  <text class="tool-l" x="620" y="116" font-size="10" font-weight="400">refs/indexes/* updater</text>

  <rect class="tool" x="760" y="80" width="200" height="50" rx="4"/>
  <text class="tool-l" x="860" y="100">tools/observe</text>
  <text class="tool-l" x="860" y="116" font-size="10" font-weight="400">prometheus exporter</text>

  <!-- arrows: app -> consensus / core -->
  <line class="arrow" x1="105" y1="230" x2="270" y2="380"/>
  <line class="arrow" x1="105" y1="230" x2="430" y2="380"/>
  <line class="arrow" x1="245" y1="230" x2="490" y2="290"/>
  <line class="arrow" x1="385" y1="230" x2="430" y2="380"/>
  <line class="arrow" x1="525" y1="230" x2="270" y2="380"/>

  <!-- consensus -> core deps -->
  <line class="arrow" x1="490" y1="350" x2="270" y2="380"/>
  <line class="arrow" x1="490" y1="350" x2="430" y2="380"/>
  <line class="arrow" x1="490" y1="350" x2="590" y2="380"/>
  <line class="arrow" x1="490" y1="350" x2="900" y2="380"/>

  <!-- core -> externals -->
  <line class="arrow-w" x1="110" y1="440" x2="100" y2="540"/>
  <line class="arrow-w" x1="270" y1="440" x2="240" y2="540"/>
  <line class="arrow-w" x1="430" y1="440" x2="380" y2="540"/>
  <line class="arrow-w" x1="590" y1="440" x2="520" y2="540"/>
  <line class="arrow-w" x1="750" y1="440" x2="660" y2="540"/>
  <line class="arrow-w" x1="750" y1="440" x2="920" y2="540"/>
  <line class="arrow-w" x1="900" y1="440" x2="800" y2="540"/>

  <text class="caption" x="490" y="625">Defconfig per node class trims this graph: Class D builds only core-crypto + core-rpc + core-identity (light) + app-chanting.</text>
</svg>
