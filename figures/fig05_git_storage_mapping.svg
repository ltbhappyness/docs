<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg{fill:#f4ecd8}
      .title{fill:#1a3a5c;font-size:20px;font-weight:700;text-anchor:middle}
      .box{stroke:#1a3a5c;stroke-width:1.5;fill:#fff}
      .box-h{fill:#1a3a5c;font-size:13px;font-weight:700;text-anchor:middle}
      .box-t{fill:#2b2b2b;font-size:11px}
      .commit{fill:#dfe7f0;stroke:#1a3a5c;stroke-width:1.5}
      .tree{fill:#cfd9e6;stroke:#1a3a5c;stroke-width:1.5}
      .blob{fill:#bfcadc;stroke:#1a3a5c;stroke-width:1}
      .blob-enc{fill:#fff8df;stroke:#c9a227;stroke-width:1.5}
      .arrow{stroke:#c9a227;stroke-width:2;fill:none;marker-end:url(#ah)}
      .arrow-l{stroke:#6c7a89;stroke-width:1.5;fill:none;marker-end:url(#ah2);stroke-dasharray:4 3}
      .small{fill:#2b2b2b;font-size:10px}
      .mono{font-family:monospace;font-size:10px;fill:#1a3a5c}
      .label{fill:#1a3a5c;font-size:11px;font-weight:700}
      .caption{fill:#2b2b2b;font-size:11px;font-style:italic;text-anchor:middle}
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9a227"/>
    </marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c7a89"/>
    </marker>
  </defs>
  <rect class="bg" width="980" height="620"/>
  <text class="title" x="490" y="32">Transactions as commits: TLV blobs in a content-addressed Merkle DAG</text>

  <text class="label" x="60" y="80">Round R-1</text>
  <text class="label" x="380" y="80">Round R</text>
  <text class="label" x="700" y="80">Round R+1</text>

  <rect class="commit" x="40" y="100" width="180" height="100" rx="4"/>
  <text class="box-h"  x="130" y="120">commit (block R-1)</text>
  <text class="mono"   x="50"  y="140">parent: ...c3a1</text>
  <text class="mono"   x="50"  y="156">tree:   ...77e2</text>
  <text class="mono"   x="50"  y="172">author: shard-leader</text>
  <text class="mono"   x="50"  y="188">sig:    BLS agg(2/3)</text>

  <rect class="commit" x="360" y="100" width="180" height="100" rx="4"/>
  <text class="box-h"  x="450" y="120">commit (block R)</text>
  <text class="mono"   x="370" y="140">parent: ...d4f9</text>
  <text class="mono"   x="370" y="156">tree:   ...88a3</text>
  <text class="mono"   x="370" y="172">round metadata TLV</text>
  <text class="mono"   x="370" y="188">finality cert (BLS)</text>

  <rect class="commit" x="680" y="100" width="180" height="100" rx="4"/>
  <text class="box-h"  x="770" y="120">commit (block R+1)</text>
  <text class="mono"   x="690" y="140">parent: ...88a3</text>
  <text class="mono"   x="690" y="156">tree:   ...91bc</text>
  <text class="mono"   x="690" y="172">...</text>

  <line class="arrow" x1="220" y1="150" x2="358" y2="150"/>
  <line class="arrow" x1="540" y1="150" x2="678" y2="150"/>

  <rect class="tree" x="280" y="240" width="340" height="60" rx="4"/>
  <text class="box-h" x="450" y="262">tree (state at round R)</text>
  <text class="mono"  x="290" y="282">100644 chapters/  ...      80644 indexes/  ...      40000 contracts/</text>

  <line class="arrow-l" x1="450" y1="200" x2="450" y2="240"/>

  <g>
    <rect class="blob" x="60"  y="340" width="170" height="120" rx="4"/>
    <text class="box-h" x="145" y="360">blob: chapter delta</text>
    <text class="mono"  x="70"  y="380">TLV (Type-Length-Value)</text>
    <text class="mono"  x="70"  y="396">T=0x10 chapter-id</text>
    <text class="mono"  x="70"  y="410">T=0x21 wrapped-keys[]</text>
    <text class="mono"  x="70"  y="424">T=0x30 ciphertext</text>
    <text class="mono"  x="70"  y="438">T=0xF0 sig (Ed25519)</text>

    <rect class="blob-enc" x="260" y="340" width="170" height="120" rx="4"/>
    <text class="box-h" x="345" y="360">blob: encrypted payload</text>
    <text class="mono"  x="270" y="380">AES-256-GCM (libsodium)</text>
    <text class="mono"  x="270" y="396">key wrapped per recipient</text>
    <text class="mono"  x="270" y="410">forward secrecy: epoch tag</text>
    <text class="mono"  x="270" y="424">tree shape public</text>
    <text class="mono"  x="270" y="438">payload private</text>

    <rect class="blob" x="460" y="340" width="170" height="120" rx="4"/>
    <text class="box-h" x="545" y="360">blob: vbc smart contract</text>
    <text class="mono"  x="470" y="380">TLV bytecode</text>
    <text class="mono"  x="470" y="396">T=0x40 ops[]</text>
    <text class="mono"  x="470" y="410">T=0x41 mem-bound</text>
    <text class="mono"  x="470" y="424">T=0x42 gas-bound</text>
    <text class="mono"  x="470" y="438">T=0xF0 sig</text>

    <rect class="blob" x="660" y="340" width="170" height="120" rx="4"/>
    <text class="box-h" x="745" y="360">blob: index entry</text>
    <text class="mono"  x="670" y="380">refs/indexes/by-time</text>
    <text class="mono"  x="670" y="396">key=epoch:offset</text>
    <text class="mono"  x="670" y="410">val=blob-hash</text>
    <text class="mono"  x="670" y="424">no external DB</text>
  </g>

  <line class="arrow-l" x1="380" y1="300" x2="145" y2="340"/>
  <line class="arrow-l" x1="430" y1="300" x2="345" y2="340"/>
  <line class="arrow-l" x1="500" y1="300" x2="545" y2="340"/>
  <line class="arrow-l" x1="550" y1="300" x2="745" y2="340"/>

  <rect class="box" x="40" y="500" width="900" height="80" rx="4"/>
  <text class="label" x="50" y="520">Replication classes</text>
  <text class="small" x="50"  y="540">Class A: full clone of all shards (--mirror).  Class B: subscribed shards full + others depth=N.</text>
  <text class="small" x="50"  y="556">Class C: tip + last K, --filter=blob:none with promisor remotes.  Class D: signed root only + on-demand Merkle proofs.</text>
  <text class="small" x="50"  y="572">Object hash = SHA-256.  Same git protocol, different defconfigs.  Garbage collection respects finality horizon.</text>

  <text class="caption" x="490" y="610">Every transaction is a TLV blob; every block is a commit; every state is a tree; the chain is a git DAG.</text>
</svg>
