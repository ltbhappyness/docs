<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg{fill:#f4ecd8}
      .title{fill:#1a3a5c;font-size:20px;font-weight:700;text-anchor:middle}
      .actor{fill:#1a3a5c;stroke:#0e2540;stroke-width:1.5}
      .actor-l{fill:#fff;font-size:13px;font-weight:700;text-anchor:middle}
      .net{fill:#dfe7f0;stroke:#1a3a5c;stroke-width:1.5}
      .net-l{fill:#1a3a5c;font-size:13px;font-weight:700;text-anchor:middle}
      .step{fill:#fff8df;stroke:#c9a227;stroke-width:1}
      .step-h{fill:#1a3a5c;font-size:11px;font-weight:700}
      .step-t{fill:#2b2b2b;font-size:10px}
      .arrow{stroke:#c9a227;stroke-width:2;fill:none;marker-end:url(#ah)}
      .arrow-r{stroke:#6c7a89;stroke-width:1.5;fill:none;marker-end:url(#ah);stroke-dasharray:5 3}
      .small{fill:#2b2b2b;font-size:10px}
      .panel{fill:#fff;stroke:#1a3a5c;stroke-width:1}
      .label{fill:#1a3a5c;font-size:12px;font-weight:700}
      .caption{fill:#2b2b2b;font-size:11px;font-style:italic;text-anchor:middle}
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9a227"/>
    </marker>
  </defs>
  <rect class="bg" width="980" height="600"/>
  <text class="title" x="490" y="32">Identity bootstrap: UIDAI 2FA + ZK proof of personhood (Vedam never stores Aadhaar)</text>

  <!-- Three actors -->
  <rect class="actor" x="40"  y="80" width="180" height="60" rx="4"/>
  <text class="actor-l" x="130" y="115">User (human)</text>

  <rect class="actor" x="400" y="80" width="180" height="60" rx="4"/>
  <text class="actor-l" x="490" y="105">UIDAI</text>
  <text class="actor-l" x="490" y="125" font-size="10" font-weight="400">(government 2FA)</text>

  <rect class="net" x="760" y="80" width="180" height="60" rx="4"/>
  <text class="net-l" x="850" y="105">Vedam network</text>
  <text class="net-l" x="850" y="125" font-size="10" font-weight="400">(no PII storage)</text>

  <!-- Step boxes -->
  <rect class="step" x="40"  y="180" width="180" height="60" rx="4"/>
  <text class="step-h" x="50"  y="200">1. Generate keys</text>
  <text class="step-t" x="50"  y="216">Ed25519 root identity</text>
  <text class="step-t" x="50"  y="232">held in TPM/SE/Yubi</text>

  <rect class="step" x="40"  y="260" width="180" height="60" rx="4"/>
  <text class="step-h" x="50"  y="280">2. Aadhaar OTP</text>
  <text class="step-t" x="50"  y="296">enter Aadhaar number</text>
  <text class="step-t" x="50"  y="312">receive OTP via SMS/app</text>

  <rect class="step" x="400" y="260" width="180" height="60" rx="4"/>
  <text class="step-h" x="410" y="280">3. Verify OTP</text>
  <text class="step-t" x="410" y="296">UIDAI confirms identity</text>
  <text class="step-t" x="410" y="312">issues signed e-KYC ticket</text>

  <rect class="step" x="40"  y="340" width="180" height="60" rx="4"/>
  <text class="step-h" x="50"  y="360">4. Local ZK</text>
  <text class="step-t" x="50"  y="376">prove "uniqueness" without</text>
  <text class="step-t" x="50"  y="392">revealing Aadhaar number</text>

  <rect class="step" x="400" y="340" width="180" height="60" rx="4"/>
  <text class="step-h" x="410" y="360">5. Anon-Aadhaar style</text>
  <text class="step-t" x="410" y="376">UIDAI sig + Vedam pubkey</text>
  <text class="step-t" x="410" y="392">-&gt; SNARK (groth16/halo2)</text>

  <rect class="step" x="760" y="340" width="180" height="60" rx="4"/>
  <text class="step-h" x="770" y="360">6. Verify proof</text>
  <text class="step-t" x="770" y="376">Vedam node checks SNARK</text>
  <text class="step-t" x="770" y="392">+ nullifier (no double-id)</text>

  <rect class="step" x="760" y="420" width="180" height="60" rx="4"/>
  <text class="step-h" x="770" y="440">7. Commit identity</text>
  <text class="step-t" x="770" y="456">git commit: refs/identities/</text>
  <text class="step-t" x="770" y="472">stores nullifier + pubkey only</text>

  <!-- Arrows -->
  <line class="arrow" x1="220" y1="290" x2="400" y2="290"/>
  <line class="arrow" x1="490" y1="320" x2="490" y2="340"/>
  <line class="arrow" x1="220" y1="370" x2="400" y2="370"/>
  <line class="arrow" x1="580" y1="370" x2="760" y2="370"/>
  <line class="arrow" x1="850" y1="400" x2="850" y2="420"/>

  <!-- Right panel: properties -->
  <rect class="panel" x="40" y="495" width="900" height="80" rx="4"/>
  <text class="label" x="50" y="515">What Vedam learns: a unique nullifier (proves "one human") + a pubkey (your identity).  What it does NOT learn: your Aadhaar number,</text>
  <text class="label" x="50" y="531">your name, your address, your face, your biometric. The proof attests "this UIDAI-verified human has not registered before".</text>
  <text class="small" x="50" y="552">Future replacements: pluggable PoP providers (BrightID, Worldcoin, Idena, government IDs of other countries). Same Vedam interface; different provers.</text>

  <text class="caption" x="490" y="595">Machines bypass UIDAI: TPM/Secure Enclave attestation -&gt; one machine = one identity bound to hardware.</text>
</svg>
