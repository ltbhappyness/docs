<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg{fill:#f4ecd8}
      .title{fill:#1a3a5c;font-size:20px;font-weight:700;text-anchor:middle}
      .layer{stroke:#1a3a5c;stroke-width:1.5}
      .l-name{fill:#1a3a5c;font-size:14px;font-weight:700}
      .l-detail{fill:#2b2b2b;font-size:11px}
      .arrow{stroke:#c9a227;stroke-width:2;fill:none;marker-end:url(#ah)}
      .side{fill:#fff8df;stroke:#c9a227;stroke-width:1}
      .side-text{fill:#1a3a5c;font-size:10px;text-anchor:middle;font-weight:700}
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9a227"/>
    </marker>
  </defs>
  <rect class="bg" width="900" height="720"/>
  <text class="title" x="450" y="32">Vedam  -  layered reference architecture</text>

  <!-- Layers from top to bottom -->
  <g>
    <rect class="layer" x="80" y="60" width="660" height="60" fill="#dfe7f0" rx="4"/>
    <text class="l-name" x="100" y="83">DApps (any language)</text>
    <text class="l-detail" x="100" y="103">chanting . marketplace . search . streaming . custom . UI . oracles</text>

    <rect class="layer" x="80" y="130" width="660" height="60" fill="#cfd9e6" rx="4"/>
    <text class="l-name" x="100" y="153">External API  -  gRPC + gRPC-Web (over QUIC where possible)</text>
    <text class="l-detail" x="100" y="173">codegen for any language . mTLS or signed JWT . subscriptions via server-stream</text>

    <rect class="layer" x="80" y="200" width="660" height="60" fill="#bfcadc" rx="4"/>
    <text class="l-name" x="100" y="223">App layer  -  first-class apps as plugin processes</text>
    <text class="l-detail" x="100" y="243">app-builder . app-discovery (S3E gossip) . app-indexer . app-chanting . ...</text>

    <rect class="layer" x="80" y="270" width="660" height="60" fill="#aebbcf" rx="4"/>
    <text class="l-name" x="100" y="293">Execution  -  Vedam ByteCode (vbc) + off-chain signed services</text>
    <text class="l-detail" x="100" y="313">integer-only deterministic interpreter . gas/mem bounds . TLV smart-contract format</text>

    <rect class="layer" x="80" y="340" width="660" height="60" fill="#9eaec5" rx="4"/>
    <text class="l-name" x="100" y="363">Consensus  -  HotStuff base + Bullshark mempool, layered L0/L1/L2/L3</text>
    <text class="l-detail" x="100" y="383">global root committee . shard BFT . chapter single-writer . IoT batched anchor</text>

    <rect class="layer" x="80" y="410" width="660" height="60" fill="#8ea1bd" rx="4"/>
    <text class="l-name" x="100" y="433">Identity &amp; crypto  -  UIDAI-anchored ZK + hardware attestation + NaCl/Noise</text>
    <text class="l-detail" x="100" y="453">PoP humans . TPM/SE machines . key wrapping per recipient . PQ-migration ready</text>

    <rect class="layer" x="80" y="480" width="660" height="60" fill="#7e94b4" rx="4"/>
    <text class="l-name" x="100" y="503" fill="#fff">Storage  -  libgit2 (SHA-256) + secondary indexes in refs/indexes/*</text>
    <text class="l-detail" x="100" y="523" fill="#e8eef2">commit-as-block . partial clone + promisor remotes . TLV blobs . Reed-Solomon archive</text>

    <rect class="layer" x="80" y="550" width="660" height="60" fill="#6e87aa" rx="4"/>
    <text class="l-name" x="100" y="573" fill="#fff">P2P transport  -  libp2p (QUIC/TCP + Noise + mux + Kademlia DHT + gossipsub)</text>
    <text class="l-detail" x="100" y="593" fill="#e8eef2">gRPC frames over libp2p stream . NAT hole-punching . Penrose neighborhood peer pick</text>

    <rect class="layer" x="80" y="620" width="660" height="60" fill="#5e7aa0" rx="4"/>
    <text class="l-name" x="100" y="643" fill="#fff">OS substrate  -  plain Linux + namespaces + seccomp (no full VM, no enclave)</text>
    <text class="l-detail" x="100" y="663" fill="#e8eef2">runs on x86_64 / aarch64 / riscv64 . same binary across class via defconfig + reproducible build</text>
  </g>

  <!-- Side annotations -->
  <g>
    <rect class="side" x="760" y="200" width="120" height="160" rx="4"/>
    <text class="side-text" x="820" y="220">Submodule</text>
    <text class="side-text" x="820" y="238">Plugin Mesh</text>
    <text class="side-text" x="820" y="262" font-weight="400" font-size="9">core-rpc bridges</text>
    <text class="side-text" x="820" y="276" font-weight="400" font-size="9">gRPC over UDS</text>
    <text class="side-text" x="820" y="290" font-weight="400" font-size="9">to all submodules</text>
    <text class="side-text" x="820" y="316" font-weight="400" font-size="9">CMake .config</text>
    <text class="side-text" x="820" y="330" font-weight="400" font-size="9">selects which</text>
    <text class="side-text" x="820" y="344" font-weight="400" font-size="9">submodules build</text>

    <rect class="side" x="760" y="410" width="120" height="120" rx="4"/>
    <text class="side-text" x="820" y="430">Crypto used</text>
    <text class="side-text" x="820" y="450" font-weight="400" font-size="9">libsodium (NaCl)</text>
    <text class="side-text" x="820" y="464" font-weight="400" font-size="9">Noise-C</text>
    <text class="side-text" x="820" y="478" font-weight="400" font-size="9">arkworks (ZK)</text>
    <text class="side-text" x="820" y="492" font-weight="400" font-size="9">liboqs (PQ)</text>
    <text class="side-text" x="820" y="506" font-weight="400" font-size="9">no hand-rolled</text>
    <text class="side-text" x="820" y="520" font-weight="400" font-size="9">primitives</text>
  </g>

  <text x="450" y="710" font-size="11" fill="#2b2b2b" text-anchor="middle" font-style="italic">
    All inter-layer interfaces are protobuf schemas; same proto generates internal IPC, network frames, and external SDKs.
  </text>
</svg>
