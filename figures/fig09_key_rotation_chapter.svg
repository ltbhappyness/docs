<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg{fill:#f4ecd8}
      .title{fill:#1a3a5c;font-size:20px;font-weight:700;text-anchor:middle}
      .axis{stroke:#1a3a5c;stroke-width:2;fill:none}
      .epoch{fill:#dfe7f0;stroke:#1a3a5c;stroke-width:1.5}
      .epoch-l{fill:#1a3a5c;font-size:13px;font-weight:700;text-anchor:middle}
      .epoch-d{fill:#2b2b2b;font-size:11px;text-anchor:middle}
      .key-old{fill:#79a3c9;stroke:#1a3a5c;stroke-width:1.5}
      .key-new{fill:#c9a227;stroke:#1a3a5c;stroke-width:1.5}
      .msg{fill:#fff;stroke:#1a3a5c;stroke-width:1;rx:3}
      .small{fill:#2b2b2b;font-size:10px;text-anchor:middle}
      .mono{font-family:monospace;font-size:10px;fill:#1a3a5c}
      .caption{fill:#2b2b2b;font-size:11px;font-style:italic;text-anchor:middle}
      .panel{fill:#fff;stroke:#1a3a5c;stroke-width:1}
      .label{fill:#1a3a5c;font-size:12px;font-weight:700}
    </style>
  </defs>
  <rect class="bg" width="980" height="560"/>
  <text class="title" x="490" y="32">Chapter key rotation: epoch-tagged payloads; old messages still readable</text>

  <line class="axis" x1="60" y1="280" x2="920" y2="280"/>
  <text class="label" x="60" y="300">time -&gt;</text>

  <!-- Epoch 0 -->
  <rect class="epoch" x="80"  y="220" width="180" height="60" rx="4"/>
  <text class="epoch-l" x="170" y="240">Epoch 0</text>
  <text class="epoch-d" x="170" y="258">k0 = Ed25519 keypair</text>
  <text class="epoch-d" x="170" y="272">commits 0..N0</text>

  <rect class="epoch" x="280" y="220" width="180" height="60" rx="4"/>
  <text class="epoch-l" x="370" y="240">Epoch 1</text>
  <text class="epoch-d" x="370" y="258">k1 = rotated</text>
  <text class="epoch-d" x="370" y="272">commits N0+1..N1</text>

  <rect class="epoch" x="480" y="220" width="180" height="60" rx="4"/>
  <text class="epoch-l" x="570" y="240">Epoch 2</text>
  <text class="epoch-d" x="570" y="258">k2 = rotated (HW-backed)</text>
  <text class="epoch-d" x="570" y="272">commits N1+1..N2</text>

  <rect class="epoch" x="680" y="220" width="200" height="60" rx="4"/>
  <text class="epoch-l" x="780" y="240">Epoch 3 (PQ migration)</text>
  <text class="epoch-d" x="780" y="258">k3 = Dilithium + Ed25519</text>
  <text class="epoch-d" x="780" y="272">commits N2+1..</text>

  <!-- Key history timeline -->
  <text class="label" x="60" y="120">Key history (kept by user; encrypted at rest)</text>
  <g>
    <circle class="key-old" cx="170" cy="160" r="12"/>
    <text class="small" x="170" y="164" fill="#fff" font-weight="700">k0</text>
    <circle class="key-old" cx="370" cy="160" r="12"/>
    <text class="small" x="370" y="164" fill="#fff" font-weight="700">k1</text>
    <circle class="key-new" cx="570" cy="160" r="12"/>
    <text class="small" x="570" y="164" fill="#1a3a5c" font-weight="700">k2</text>
    <circle class="key-new" cx="780" cy="160" r="12"/>
    <text class="small" x="780" y="164" fill="#1a3a5c" font-weight="700">k3</text>
  </g>
  <line class="axis" x1="170" y1="172" x2="170" y2="220" stroke-dasharray="3 2"/>
  <line class="axis" x1="370" y1="172" x2="370" y2="220" stroke-dasharray="3 2"/>
  <line class="axis" x1="570" y1="172" x2="570" y2="220" stroke-dasharray="3 2"/>
  <line class="axis" x1="780" y1="172" x2="780" y2="220" stroke-dasharray="3 2"/>

  <!-- Encrypted messages -->
  <text class="label" x="60" y="340">Stored encrypted payloads (epoch tag in TLV)</text>
  <g>
    <rect class="msg" x="100"  y="360" width="60" height="36"/><text class="mono" x="130" y="377" text-anchor="middle">e=0</text><text class="mono" x="130" y="389" text-anchor="middle">m1</text>
    <rect class="msg" x="170"  y="360" width="60" height="36"/><text class="mono" x="200" y="377" text-anchor="middle">e=0</text><text class="mono" x="200" y="389" text-anchor="middle">m2</text>
    <rect class="msg" x="300"  y="360" width="60" height="36"/><text class="mono" x="330" y="377" text-anchor="middle">e=1</text><text class="mono" x="330" y="389" text-anchor="middle">m3</text>
    <rect class="msg" x="370"  y="360" width="60" height="36"/><text class="mono" x="400" y="377" text-anchor="middle">e=1</text><text class="mono" x="400" y="389" text-anchor="middle">m4</text>
    <rect class="msg" x="500"  y="360" width="60" height="36"/><text class="mono" x="530" y="377" text-anchor="middle">e=2</text><text class="mono" x="530" y="389" text-anchor="middle">m5</text>
    <rect class="msg" x="570"  y="360" width="60" height="36"/><text class="mono" x="600" y="377" text-anchor="middle">e=2</text><text class="mono" x="600" y="389" text-anchor="middle">m6</text>
    <rect class="msg" x="700"  y="360" width="60" height="36"/><text class="mono" x="730" y="377" text-anchor="middle">e=3</text><text class="mono" x="730" y="389" text-anchor="middle">m7</text>
    <rect class="msg" x="780"  y="360" width="60" height="36"/><text class="mono" x="810" y="377" text-anchor="middle">e=3</text><text class="mono" x="810" y="389" text-anchor="middle">m8</text>
  </g>

  <!-- Right panel: properties -->
  <rect class="panel" x="40" y="430" width="900" height="100" rx="4"/>
  <text class="label" x="50" y="450">Properties</text>
  <text class="small" x="240"  y="470" text-anchor="start">- Each blob TLV records its epoch (T=0x05 epoch-id, T=0x06 wrapped-key-set).</text>
  <text class="small" x="240"  y="486" text-anchor="start">- User retains private keys for all past epochs (sealed under master passphrase / HSM).</text>
  <text class="small" x="240"  y="502" text-anchor="start">- Recipient revocation: new wrapped-key-set excludes revoked id; old messages remain decryptable for revoked party (math limit).</text>
  <text class="small" x="240"  y="518" text-anchor="start">- Forward secrecy for live conversations: Double Ratchet over Vedam transport.</text>
  <text class="small" x="240"  y="538" text-anchor="start" font-style="italic">- Quantum migration: hybrid Dilithium+Ed25519 dual signature during transition; verifiers accept either until cutoff.</text>

  <text class="caption" x="490" y="555">Lost master? Social recovery via FROST 3-of-5 guardians; key never reconstructed at one place.</text>
</svg>
