<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg{fill:#f4ecd8}
      .title{fill:#1a3a5c;font-size:20px;font-weight:700;text-anchor:middle}
      .actor{fill:#dfe7f0;stroke:#1a3a5c;stroke-width:1.5}
      .actor-l{fill:#1a3a5c;font-size:13px;font-weight:700;text-anchor:middle}
      .builder{fill:#1a3a5c;stroke:#0e2540;stroke-width:1.5}
      .builder-l{fill:#fff;font-size:13px;font-weight:700;text-anchor:middle}
      .step{fill:#fff8df;stroke:#c9a227;stroke-width:1}
      .step-h{fill:#1a3a5c;font-size:11px;font-weight:700}
      .step-t{fill:#2b2b2b;font-size:10px}
      .arrow{stroke:#c9a227;stroke-width:2;fill:none;marker-end:url(#ah)}
      .arrow-r{stroke:#6c7a89;stroke-width:1.5;fill:none;marker-end:url(#ah2);stroke-dasharray:5 3}
      .small{fill:#2b2b2b;font-size:10px}
      .panel{fill:#fff;stroke:#1a3a5c;stroke-width:1}
      .label{fill:#1a3a5c;font-size:12px;font-weight:700}
      .caption{fill:#2b2b2b;font-size:11px;font-style:italic;text-anchor:middle}
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9a227"/>
    </marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c7a89"/>
    </marker>
  </defs>
  <rect class="bg" width="980" height="600"/>
  <text class="title" x="490" y="32">Distributed reproducible build (Nix flakes + signed provenance)</text>

  <!-- Requestor -->
  <rect class="actor" x="40"  y="80" width="160" height="80" rx="4"/>
  <text class="actor-l" x="120" y="105">Requestor</text>
  <text class="actor-l" x="120" y="124" font-size="10" font-weight="400">(Class C/D phone)</text>
  <text class="step-t"  x="50"  y="142">wants: app-chanting</text>
  <text class="step-t"  x="50"  y="155">target: aarch64</text>

  <!-- Builders -->
  <rect class="builder" x="280" y="80" width="160" height="80" rx="4"/>
  <text class="builder-l" x="360" y="105">Builder #1</text>
  <text class="builder-l" x="360" y="124" font-size="10" font-weight="400">(Class A x86_64)</text>

  <rect class="builder" x="280" y="180" width="160" height="80" rx="4"/>
  <text class="builder-l" x="360" y="205">Builder #2</text>
  <text class="builder-l" x="360" y="224" font-size="10" font-weight="400">(Class B aarch64)</text>

  <rect class="builder" x="280" y="280" width="160" height="80" rx="4"/>
  <text class="builder-l" x="360" y="305">Builder #3</text>
  <text class="builder-l" x="360" y="324" font-size="10" font-weight="400">(Class A riscv64)</text>

  <!-- Source -->
  <rect class="actor" x="520" y="160" width="160" height="80" rx="4"/>
  <text class="actor-l" x="600" y="185">Source repo</text>
  <text class="actor-l" x="600" y="204" font-size="10" font-weight="400">(libgit2 chapter)</text>
  <text class="step-t"  x="530" y="220">flake.nix + sha</text>

  <!-- Cache -->
  <rect class="actor" x="520" y="280" width="160" height="80" rx="4"/>
  <text class="actor-l" x="600" y="305">Network cache</text>
  <text class="actor-l" x="600" y="324" font-size="10" font-weight="400">(content-addr)</text>
  <text class="step-t"  x="530" y="340">hash -&gt; binary</text>

  <!-- Provenance -->
  <rect class="actor" x="760" y="160" width="180" height="80" rx="4"/>
  <text class="actor-l" x="850" y="185">Provenance ledger</text>
  <text class="actor-l" x="850" y="204" font-size="10" font-weight="400">(SLSA / in-toto)</text>
  <text class="step-t"  x="770" y="220">signed attestations</text>

  <!-- Steps numbered -->
  <text class="step-h" x="210" y="105">1</text>
  <line class="arrow" x1="200" y1="120" x2="280" y2="120"/>

  <text class="step-h" x="465" y="195">2</text>
  <line class="arrow-r" x1="440" y1="200" x2="520" y2="200"/>

  <text class="step-h" x="465" y="295">3a</text>
  <line class="arrow-r" x1="440" y1="320" x2="520" y2="320"/>

  <text class="step-h" x="710" y="220">3b</text>
  <line class="arrow" x1="680" y1="220" x2="760" y2="220"/>

  <line class="arrow" x1="280" y1="220" x2="200" y2="160"/>

  <!-- Bottom panel -->
  <rect class="panel" x="40" y="400" width="900" height="180" rx="4"/>
  <text class="label" x="50" y="420">Steps</text>
  <text class="small" x="50" y="438">1.  Requestor publishes "build-request" event on shard discovery: { source-hash, target-triple, cap-required }.</text>
  <text class="small" x="50" y="454">2.  Builders fetch source via libgit2 (only those with the matching target capability accept the work).</text>
  <text class="small" x="50" y="470">3a. nix build the flake. Output is content-addressed; if reproducible, multiple builders converge on the SAME hash.</text>
  <text class="small" x="50" y="486">3b. Builder publishes signed attestation: { source-hash, target, output-hash, builder-id, timestamp, build-env }.</text>
  <text class="small" x="50" y="502">4.  Requestor accepts the binary if N=2 independent builders attest the same output-hash (k-of-N agreement, no fees).</text>
  <text class="small" x="50" y="518">5.  Binary served from any cache that holds it (DHT lookup by output-hash).</text>
  <text class="small" x="50" y="535" font-style="italic">Determinism rules: pinned compilers, stripped timestamps, sorted file lists, fixed locale, no network during build.</text>
  <text class="small" x="50" y="556" font-style="italic">Trust model: requestor chooses which builder identities to trust. No central authority decides.</text>

  <text class="caption" x="490" y="595">Reproducibility is the keystone: without it, "any-language DApps" become unverifiable binary blobs.</text>
</svg>
