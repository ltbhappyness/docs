<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg{fill:#f4ecd8}
      .title{fill:#1a3a5c;font-size:20px;font-weight:700;text-anchor:middle}
      .col{fill:#fff;stroke:#1a3a5c;stroke-width:1.5}
      .col-h{fill:#1a3a5c;font-size:13px;font-weight:700;text-anchor:middle}
      .step{fill:#dfe7f0;stroke:#1a3a5c;stroke-width:1}
      .step-t{fill:#2b2b2b;font-size:11px}
      .step-n{fill:#1a3a5c;font-size:11px;font-weight:700}
      .arrow{stroke:#c9a227;stroke-width:2;fill:none;marker-end:url(#ah)}
      .small{fill:#2b2b2b;font-size:10px}
      .caption{fill:#2b2b2b;font-size:11px;font-style:italic;text-anchor:middle}
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9a227"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="620"/>
  <text class="title" x="500" y="32">app-chanting message lifecycle (Alice -&gt; Bob)</text>

  <g>
    <rect class="col" x="20"  y="60" width="180" height="540" rx="4"/>
    <text class="col-h" x="110" y="82">Alice (Class C laptop)</text>

    <rect class="col" x="220" y="60" width="180" height="540" rx="4"/>
    <text class="col-h" x="310" y="82">Alice node (libp2p)</text>

    <rect class="col" x="420" y="60" width="180" height="540" rx="4"/>
    <text class="col-h" x="510" y="82">Shard B validators</text>

    <rect class="col" x="620" y="60" width="180" height="540" rx="4"/>
    <text class="col-h" x="710" y="82">Bob node (libp2p)</text>

    <rect class="col" x="820" y="60" width="160" height="540" rx="4"/>
    <text class="col-h" x="900" y="82">Bob (Class D phone)</text>
  </g>

  <!-- Steps -->
  <rect class="step" x="30"  y="110" width="160" height="40"/>
  <text class="step-n" x="40"  y="125">1. compose</text>
  <text class="step-t" x="40"  y="142">UI -&gt; gRPC SendMessage()</text>

  <rect class="step" x="230" y="110" width="160" height="40"/>
  <text class="step-n" x="240" y="125">2. encrypt</text>
  <text class="step-t" x="240" y="142">NaCl box(payload, [Bob])</text>

  <rect class="step" x="230" y="160" width="160" height="40"/>
  <text class="step-n" x="240" y="175">3. wrap key</text>
  <text class="step-t" x="240" y="192">key wrapped per recipient</text>

  <rect class="step" x="230" y="210" width="160" height="40"/>
  <text class="step-n" x="240" y="225">4. sign + TLV</text>
  <text class="step-t" x="240" y="242">Ed25519 sig over blob</text>

  <rect class="step" x="230" y="260" width="160" height="40"/>
  <text class="step-n" x="240" y="275">5. submit</text>
  <text class="step-t" x="240" y="292">gossipsub /vedam/shard-B/v1</text>

  <rect class="step" x="430" y="260" width="160" height="40"/>
  <text class="step-n" x="440" y="275">6. mempool (Narwhal)</text>
  <text class="step-t" x="440" y="292">DAG of pending blobs</text>

  <rect class="step" x="430" y="310" width="160" height="40"/>
  <text class="step-n" x="440" y="325">7. consensus (Bullshark)</text>
  <text class="step-t" x="440" y="342">total order @ round R</text>

  <rect class="step" x="430" y="360" width="160" height="40"/>
  <text class="step-n" x="440" y="375">8. commit to git</text>
  <text class="step-t" x="440" y="392">tree -&gt; commit -&gt; sig (BLS)</text>

  <rect class="step" x="430" y="410" width="160" height="40"/>
  <text class="step-n" x="440" y="425">9. anchor to L0</text>
  <text class="step-t" x="440" y="442">Merkle-of-Merkles update</text>

  <rect class="step" x="630" y="360" width="160" height="40"/>
  <text class="step-n" x="640" y="375">10. fetch new tip</text>
  <text class="step-t" x="640" y="392">promisor pull, blob:none</text>

  <rect class="step" x="630" y="410" width="160" height="40"/>
  <text class="step-n" x="640" y="425">11. verify proof</text>
  <text class="step-t" x="640" y="442">BLS root + Merkle path</text>

  <rect class="step" x="630" y="460" width="160" height="40"/>
  <text class="step-n" x="640" y="475">12. unwrap key</text>
  <text class="step-t" x="640" y="492">decrypt with Bob priv-key</text>

  <rect class="step" x="830" y="460" width="140" height="40"/>
  <text class="step-n" x="840" y="475">13. notify</text>
  <text class="step-t" x="840" y="492">gRPC SubscribeMessages</text>

  <rect class="step" x="830" y="510" width="140" height="40"/>
  <text class="step-n" x="840" y="525">14. render</text>
  <text class="step-t" x="840" y="542">UI bubble</text>

  <!-- Arrows -->
  <line class="arrow" x1="190" y1="130" x2="230" y2="130"/>
  <line class="arrow" x1="310" y1="150" x2="310" y2="160"/>
  <line class="arrow" x1="310" y1="200" x2="310" y2="210"/>
  <line class="arrow" x1="310" y1="250" x2="310" y2="260"/>
  <line class="arrow" x1="390" y1="280" x2="430" y2="280"/>
  <line class="arrow" x1="510" y1="300" x2="510" y2="310"/>
  <line class="arrow" x1="510" y1="350" x2="510" y2="360"/>
  <line class="arrow" x1="510" y1="400" x2="510" y2="410"/>
  <line class="arrow" x1="590" y1="380" x2="630" y2="380"/>
  <line class="arrow" x1="710" y1="400" x2="710" y2="410"/>
  <line class="arrow" x1="710" y1="450" x2="710" y2="460"/>
  <line class="arrow" x1="790" y1="480" x2="830" y2="480"/>
  <line class="arrow" x1="900" y1="500" x2="900" y2="510"/>

  <text class="caption" x="500" y="600">Total wall-clock target end-to-end p50: under 2 seconds. Class D phone never holds shard state; verifies via Merkle proof only.</text>
</svg>
