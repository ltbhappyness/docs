<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg{fill:#f4ecd8}
      .hub{fill:#1a3a5c;stroke:#0e2540;stroke-width:2}
      .hub-label{fill:#fff;font-size:18px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
      .leaf-b{fill:#2e5984;stroke:#1a3a5c;stroke-width:1}
      .leaf-c{fill:#79a3c9;stroke:#2e5984;stroke-width:1}
      .leaf-d{fill:#b6cce0;stroke:#2e5984;stroke-width:1}
      .leaf-label{fill:#2b2b2b;font-size:10px;text-anchor:middle}
      .hub-edge{stroke:#c9a227;stroke-width:3;fill:none}
      .leaf-edge{stroke:#6c7a89;stroke-width:1;fill:none;opacity:0.6}
      .title{fill:#1a3a5c;font-size:20px;font-weight:700;text-anchor:middle}
      .caption{fill:#2b2b2b;font-size:12px;text-anchor:middle}
      .legend-text{fill:#2b2b2b;font-size:11px}
    </style>
  </defs>
  <rect class="bg" width="900" height="700"/>
  <text class="title" x="450" y="32">Vedam topology  -  S3E hubs and capability-tier leaves</text>
  <text class="caption" x="450" y="52">Formalized from the hand-drawn sketch: 4 S3E hubs in a quadrangle, each anchoring local Class B/C/D nodes</text>

  <!-- Hub-to-hub edges (golden quadrangle) -->
  <line class="hub-edge" x1="220" y1="220" x2="640" y2="200"/>
  <line class="hub-edge" x1="640" y1="200" x2="700" y2="450"/>
  <line class="hub-edge" x1="700" y1="450" x2="380" y2="540"/>
  <line class="hub-edge" x1="380" y1="540" x2="220" y2="220"/>
  <line class="hub-edge" x1="220" y1="220" x2="700" y2="450" stroke-dasharray="6 4"/>
  <line class="hub-edge" x1="640" y1="200" x2="380" y2="540" stroke-dasharray="6 4"/>

  <!-- Hub 1 (top-left) leaves -->
  <g>
    <line class="leaf-edge" x1="220" y1="220" x2="120" y2="120"/>
    <line class="leaf-edge" x1="220" y1="220" x2="170" y2="100"/>
    <line class="leaf-edge" x1="220" y1="220" x2="240" y2="90"/>
    <line class="leaf-edge" x1="220" y1="220" x2="310" y2="120"/>
    <line class="leaf-edge" x1="220" y1="220" x2="100" y2="200"/>
    <line class="leaf-edge" x1="220" y1="220" x2="80"  y2="270"/>
    <line class="leaf-edge" x1="220" y1="220" x2="120" y2="320"/>
    <line class="leaf-edge" x1="220" y1="220" x2="190" y2="360"/>
    <line class="leaf-edge" x1="220" y1="220" x2="290" y2="320"/>
    <line class="leaf-edge" x1="220" y1="220" x2="320" y2="260"/>
    <circle class="leaf-b" cx="120" cy="120" r="9"/>
    <circle class="leaf-c" cx="170" cy="100" r="7"/>
    <circle class="leaf-c" cx="240" cy="90"  r="7"/>
    <circle class="leaf-d" cx="310" cy="120" r="6"/>
    <circle class="leaf-c" cx="100" cy="200" r="7"/>
    <circle class="leaf-d" cx="80"  cy="270" r="6"/>
    <circle class="leaf-c" cx="120" cy="320" r="7"/>
    <circle class="leaf-d" cx="190" cy="360" r="6"/>
    <circle class="leaf-c" cx="290" cy="320" r="7"/>
    <circle class="leaf-b" cx="320" cy="260" r="9"/>
  </g>
  <rect class="hub" x="180" y="195" width="80" height="50" rx="4"/>
  <text class="hub-label" x="220" y="221">S3E</text>

  <!-- Hub 2 (top-right) -->
  <g>
    <line class="leaf-edge" x1="640" y1="200" x2="560" y2="80"/>
    <line class="leaf-edge" x1="640" y1="200" x2="620" y2="60"/>
    <line class="leaf-edge" x1="640" y1="200" x2="690" y2="60"/>
    <line class="leaf-edge" x1="640" y1="200" x2="760" y2="80"/>
    <line class="leaf-edge" x1="640" y1="200" x2="820" y2="160"/>
    <line class="leaf-edge" x1="640" y1="200" x2="840" y2="240"/>
    <line class="leaf-edge" x1="640" y1="200" x2="800" y2="320"/>
    <line class="leaf-edge" x1="640" y1="200" x2="720" y2="350"/>
    <line class="leaf-edge" x1="640" y1="200" x2="560" y2="340"/>
    <line class="leaf-edge" x1="640" y1="200" x2="540" y2="260"/>
    <circle class="leaf-c" cx="560" cy="80"  r="7"/>
    <circle class="leaf-b" cx="620" cy="60"  r="9"/>
    <circle class="leaf-c" cx="690" cy="60"  r="7"/>
    <circle class="leaf-d" cx="760" cy="80"  r="6"/>
    <circle class="leaf-b" cx="820" cy="160" r="9"/>
    <circle class="leaf-c" cx="840" cy="240" r="7"/>
    <circle class="leaf-d" cx="800" cy="320" r="6"/>
    <circle class="leaf-c" cx="720" cy="350" r="7"/>
    <circle class="leaf-d" cx="560" cy="340" r="6"/>
    <circle class="leaf-c" cx="540" cy="260" r="7"/>
  </g>
  <rect class="hub" x="600" y="175" width="80" height="50" rx="4"/>
  <text class="hub-label" x="640" y="201">S3E</text>

  <!-- Hub 3 (mid-right) -->
  <g>
    <line class="leaf-edge" x1="700" y1="450" x2="820" y2="380"/>
    <line class="leaf-edge" x1="700" y1="450" x2="850" y2="430"/>
    <line class="leaf-edge" x1="700" y1="450" x2="850" y2="500"/>
    <line class="leaf-edge" x1="700" y1="450" x2="800" y2="560"/>
    <line class="leaf-edge" x1="700" y1="450" x2="730" y2="600"/>
    <line class="leaf-edge" x1="700" y1="450" x2="660" y2="610"/>
    <line class="leaf-edge" x1="700" y1="450" x2="580" y2="600"/>
    <line class="leaf-edge" x1="700" y1="450" x2="540" y2="540"/>
    <line class="leaf-edge" x1="700" y1="450" x2="560" y2="460"/>
    <line class="leaf-edge" x1="700" y1="450" x2="600" y2="380"/>
    <circle class="leaf-c" cx="820" cy="380" r="7"/>
    <circle class="leaf-b" cx="850" cy="430" r="9"/>
    <circle class="leaf-c" cx="850" cy="500" r="7"/>
    <circle class="leaf-d" cx="800" cy="560" r="6"/>
    <circle class="leaf-c" cx="730" cy="600" r="7"/>
    <circle class="leaf-d" cx="660" cy="610" r="6"/>
    <circle class="leaf-c" cx="580" cy="600" r="7"/>
    <circle class="leaf-d" cx="540" cy="540" r="6"/>
    <circle class="leaf-c" cx="560" cy="460" r="7"/>
    <circle class="leaf-b" cx="600" cy="380" r="9"/>
  </g>
  <rect class="hub" x="660" y="425" width="80" height="50" rx="4"/>
  <text class="hub-label" x="700" y="451">S3E</text>

  <!-- Hub 4 (bottom) -->
  <g>
    <line class="leaf-edge" x1="380" y1="540" x2="240" y2="500"/>
    <line class="leaf-edge" x1="380" y1="540" x2="200" y2="560"/>
    <line class="leaf-edge" x1="380" y1="540" x2="220" y2="630"/>
    <line class="leaf-edge" x1="380" y1="540" x2="290" y2="660"/>
    <line class="leaf-edge" x1="380" y1="540" x2="380" y2="660"/>
    <line class="leaf-edge" x1="380" y1="540" x2="460" y2="650"/>
    <line class="leaf-edge" x1="380" y1="540" x2="500" y2="600"/>
    <line class="leaf-edge" x1="380" y1="540" x2="500" y2="490"/>
    <line class="leaf-edge" x1="380" y1="540" x2="430" y2="450"/>
    <line class="leaf-edge" x1="380" y1="540" x2="320" y2="450"/>
    <circle class="leaf-c" cx="240" cy="500" r="7"/>
    <circle class="leaf-d" cx="200" cy="560" r="6"/>
    <circle class="leaf-c" cx="220" cy="630" r="7"/>
    <circle class="leaf-d" cx="290" cy="660" r="6"/>
    <circle class="leaf-c" cx="380" cy="660" r="7"/>
    <circle class="leaf-b" cx="460" cy="650" r="9"/>
    <circle class="leaf-c" cx="500" cy="600" r="7"/>
    <circle class="leaf-d" cx="500" cy="490" r="6"/>
    <circle class="leaf-c" cx="430" cy="450" r="7"/>
    <circle class="leaf-b" cx="320" cy="450" r="9"/>
  </g>
  <rect class="hub" x="340" y="515" width="80" height="50" rx="4"/>
  <text class="hub-label" x="380" y="541">S3E</text>

  <!-- Legend -->
  <g transform="translate(40,640)">
    <rect x="0" y="-12" width="820" height="40" fill="#fff" stroke="#c9a227" stroke-width="1" rx="3"/>
    <rect x="10" y="-2" width="22" height="14" fill="#1a3a5c"/>
    <text class="legend-text" x="38" y="9">S3E hub (Class A archivist + service)</text>
    <circle cx="240" cy="6" r="9" class="leaf-b"/>
    <text class="legend-text" x="255" y="9">Class B (Validator/Full)</text>
    <circle cx="430" cy="6" r="7" class="leaf-c"/>
    <text class="legend-text" x="445" y="9">Class C (Operator/Light)</text>
    <circle cx="620" cy="6" r="6" class="leaf-d"/>
    <text class="legend-text" x="635" y="9">Class D (Edge/IoT)</text>
    <line x1="10" y1="22" x2="35" y2="22" class="hub-edge"/>
    <text class="legend-text" x="40" y="25">Inter-hub link (BFT committee + global root anchoring)</text>
  </g>
</svg>
